version: '3.8'

services:
  db:
    image: postgres:14-alpine
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Use the variable from your .env file
      - "${DB_PORT}:5432"
    volumes:
      # This line is critical for creating your tables
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      # This line saves your data
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      # This runs the web interface on localhost:8080
      - "8080:8080"
    depends_on:
      - db

volumes:
  postgres_data: